<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ZipLink Studio</title>
<style>
  :root {
    --bg: #11131a; --panel: #181b24; --panel2: #1f2330; --line: #2b3040;
    --text: #e6e9f0; --dim: #949cb0; --accent: #6ea8fe;
    --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --idle: #4b5262;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; }
  .badge {
    font-size: 11px; padding: 3px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--dim); white-space: nowrap;
  }
  .badge.live { color: var(--ok); border-color: #2c5a3e; }
  .badge.stub { color: var(--warn); border-color: #5a4a1e; }
  main { display: grid; grid-template-columns: 330px 1fr; gap: 18px; padding: 18px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px;
  }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em;
       color: var(--dim); margin: 0 0 12px; font-weight: 600; }
  textarea {
    width: 100%; min-height: 84px; resize: vertical; padding: 10px;
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
    font: inherit;
  }
  button {
    background: var(--accent); color: #0b1020; border: 0; border-radius: 8px;
    padding: 9px 14px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  button.danger { background: var(--bad); color: #2a0b0b; }
  .runlist { list-style: none; margin: 0; padding: 0; max-height: 52vh; overflow: auto; }
  .runlist li {
    padding: 9px 10px; border-radius: 8px; cursor: pointer;
    border: 1px solid transparent; margin-bottom: 4px;
  }
  .runlist li:hover { background: var(--panel2); }
  .runlist li.sel { background: var(--panel2); border-color: var(--line); }
  .runlist .req { font-size: 13px; }
  .runlist .meta { font-size: 11px; color: var(--dim); font-family: var(--mono); }
  .stage {
    display: grid; grid-template-columns: 22px 1fr auto; gap: 10px;
    align-items: start; padding: 10px 0; border-top: 1px solid var(--line);
  }
  .stage:first-of-type { border-top: 0; }
  .dot { width: 11px; height: 11px; border-radius: 50%; margin-top: 5px; background: var(--idle); }
  .dot.Succeeded { background: var(--ok); }
  .dot.Failed { background: var(--bad); }
  .dot.AwaitingApproval { background: var(--warn); }
  .dot.Running, .dot.Ready { background: var(--accent); animation: pulse 1s infinite; }
  .dot.RolledBack { background: #a78bfa; }
  @keyframes pulse { 50% { opacity: .35; } }
  .stage .name { font-weight: 600; }
  .stage .sub { color: var(--dim); font-size: 12px; }
  .stage .state { font-family: var(--mono); font-size: 11px; color: var(--dim); text-align: right; }
  .gate {
    margin: 14px 0; padding: 14px; border-radius: 10px;
    background: #2a2412; border: 1px solid #5a4a1e;
  }
  .gate h3 { margin: 0 0 6px; font-size: 14px; color: var(--warn); }
  .gate .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .fail { background: #2a1414; border-color: #5a1e1e; }
  .fail h3 { color: var(--bad); }
  pre {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px; overflow: auto; max-height: 420px;
    font-family: var(--mono); font-size: 12px; margin: 0;
  }
  .tabs { display: flex; gap: 6px; margin: 16px 0 10px; flex-wrap: wrap; }
  .tabs button { background: transparent; border: 1px solid var(--line); color: var(--dim); font-weight: 500; }
  .tabs button.on { color: var(--text); border-color: var(--accent); }
  .empty { color: var(--dim); padding: 28px 0; text-align: center; }
  code { font-family: var(--mono); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>ZipLink Studio</h1>
  <span class="badge">localhost only · never deployed</span>
  <span class="badge" id="agentBadge">checking…</span>
  <span class="badge" id="budgetBadge"></span>
</header>

<main>
  <div>
    <div class="panel">
      <h2>New run</h2>
      <textarea id="requirement" placeholder="Describe a change in plain English, e.g. Add link expiry dates"></textarea>
      <div style="margin-top:10px; display:flex; gap:8px;">
        <button id="start">Start run</button>
      </div>
      <p style="color:var(--dim); font-size:12px; margin:10px 0 0;">
        The pipeline stops and asks you before anything high-impact. Agents write to an
        isolated copy of the repo — never your working tree.
      </p>
    </div>

    <div class="panel" style="margin-top:14px;">
      <h2>Runs</h2>
      <ul class="runlist" id="runs"></ul>
    </div>
  </div>

  <div class="panel" id="detail">
    <div class="empty">Select a run, or start a new one.</div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let selected = null;
let tab = 'stages';
let timer = null;

async function json(url, options) {
  const res = await fetch(url, options);
  if (!res.ok) throw new Error(await res.text() || res.statusText);
  return res.status === 202 ? null : res.json();
}

async function loadEnvironment() {
  const env = await json('/api/environment');
  const badge = $('agentBadge');
  badge.textContent = env.agentsEnabled ? `agents live · ${env.model}` : 'agents stubbed · no API key';
  badge.className = 'badge ' + (env.agentsEnabled ? 'live' : 'stub');
  $('budgetBadge').textContent = `budget ${env.budgetCalls} calls / ${env.budgetMinutes} min`;
}

async function loadRuns() {
  const runs = await json('/api/runs');
  $('runs').innerHTML = runs.map(r => `
    <li class="${r.runId === selected ? 'sel' : ''}" data-id="${r.runId}">
      <div class="req">${escapeHtml(r.requirement)}</div>
      <div class="meta">${r.runId} · ${r.status}</div>
    </li>`).join('') || '<li class="meta">No runs yet.</li>';

  document.querySelectorAll('#runs li[data-id]').forEach(li =>
    li.onclick = () => { selected = li.dataset.id; tab = 'stages'; refresh(); });
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

async function refresh() {
  await loadRuns();
  if (!selected) return;

  const run = await json(`/api/runs/${selected}`);
  const waiting = run.stages.filter(s => s.state === 'AwaitingApproval');

  let html = `
    <h2>Run</h2>
    <div style="font-size:15px; font-weight:600; margin-bottom:4px;">${escapeHtml(run.requirement)}</div>
    <div class="meta" style="color:var(--dim); font-family:var(--mono); font-size:12px;">
      ${run.runId} · ${run.status}${run.busy ? ' · working…' : ''}
    </div>`;

  if (run.failureReason) {
    html += `<div class="gate fail"><h3>Run failed</h3><div>${escapeHtml(run.failureReason)}</div></div>`;
  }
  if (run.error) {
    html += `<div class="gate fail"><h3>Background error</h3><div>${escapeHtml(run.error)}</div></div>`;
  }

  for (const stage of waiting) {
    html += `
      <div class="gate">
        <h3>Waiting on you — ${escapeHtml(stage.name)}</h3>
        <div>${escapeHtml(stage.gateReason || 'This stage needs human approval.')}</div>
        ${stage.summary ? `<div class="sub" style="margin-top:6px; color:var(--dim);">${escapeHtml(stage.summary)}</div>` : ''}
        <div class="row">
          <button data-approve="${stage.id}" ${run.busy ? 'disabled' : ''}>Approve ${stage.id}</button>
          <button class="danger" data-reject="${stage.id}" ${run.busy ? 'disabled' : ''}>Reject</button>
          ${stage.hasArtifact ? `<button class="ghost" data-art="${stage.id}">View what it produced</button>` : ''}
        </div>
      </div>`;
  }

  html += `<div class="tabs">
      <button data-tab="stages" class="${tab==='stages'?'on':''}">Stages</button>
      <button data-tab="audit" class="${tab==='audit'?'on':''}">Audit log</button>
      <button data-tab="metrics" class="${tab==='metrics'?'on':''}">Metrics</button>
    </div><div id="tabBody"></div>`;

  $('detail').innerHTML = html;

  document.querySelectorAll('[data-approve]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    await json(`/api/runs/${selected}/approve`, post({ stage: b.dataset.approve }));
    refresh();
  });
  document.querySelectorAll('[data-reject]').forEach(b => b.onclick = async () => {
    const reason = prompt('Why are you rejecting this stage?') ?? '';
    b.disabled = true;
    await json(`/api/runs/${selected}/reject`, post({ stage: b.dataset.reject, reason }));
    refresh();
  });
  document.querySelectorAll('[data-art]').forEach(b => b.onclick = () => showArtifact(b.dataset.art));
  document.querySelectorAll('[data-tab]').forEach(b =>
    b.onclick = () => { tab = b.dataset.tab; refresh(); });

  if (tab === 'stages') renderStages(run);
  else if (tab === 'audit') await renderAudit();
  else await renderMetrics();

  clearTimeout(timer);
  if (run.busy || run.status === 'Running') timer = setTimeout(refresh, 1500);
}

function post(body) {
  return { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
}

function renderStages(run) {
  $('tabBody').innerHTML = run.stages.map(s => `
    <div class="stage">
      <div class="dot ${s.state}"></div>
      <div>
        <div class="name">${s.id}${s.requiresApproval ? ' <span class="badge">approval</span>' : ''}</div>
        <div class="sub">${s.dependsOn.length ? 'after ' + s.dependsOn.join(' + ') : 'first stage'}</div>
        ${s.summary ? `<div class="sub" style="margin-top:4px;">${escapeHtml(s.summary)}</div>` : ''}
        ${s.gateReason ? `<div class="sub" style="margin-top:4px; color:var(--warn);">${escapeHtml(s.gateReason)}</div>` : ''}
        ${s.decidedBy ? `<div class="sub" style="margin-top:4px;">decided by ${escapeHtml(s.decidedBy)}</div>` : ''}
        ${s.hasArtifact ? `<button class="ghost" style="margin-top:8px;" data-art2="${s.id}">View output</button>` : ''}
      </div>
      <div class="state">${s.state}${s.seconds != null ? `<br>${s.seconds.toFixed(2)}s` : ''}${s.attempts > 1 ? `<br>${s.attempts} attempts` : ''}</div>
    </div>`).join('');

  document.querySelectorAll('[data-art2]').forEach(b => b.onclick = () => showArtifact(b.dataset.art2));
}

async function showArtifact(stageId) {
  const res = await fetch(`/api/runs/${selected}/artifacts/${stageId}`);
  const text = res.ok ? JSON.stringify(JSON.parse(await res.text()), null, 2) : 'No output recorded.';
  $('tabBody').innerHTML = `<h2>${stageId} output</h2><pre>${escapeHtml(text)}</pre>`;
}

async function renderAudit() {
  const events = await json(`/api/runs/${selected}/audit`);
  $('tabBody').innerHTML = `<pre>${events.map(e =>
    `${new Date(e.timestampUtc).toISOString().substr(11,8)}  ${e.event.padEnd(22)} ${(e.stage ?? '-').padEnd(13)} ${e.actor.padEnd(8)} ${escapeHtml(e.detail ?? '')}`
  ).join('\n')}</pre>`;
}

async function renderMetrics() {
  const m = await json(`/api/runs/${selected}/metrics`);
  const secs = (t) => (t == null ? 'n/a' : (parseFloat(String(t).split(':').reduce((a, b) => a * 60 + +b, 0)).toFixed(2) + 's'));
  $('tabBody').innerHTML = `<pre>` + escapeHtml(
`stage success rate : ${(m.stageSuccessRate * 100).toFixed(0)}%  (${m.succeeded}/${m.stageCount})
failed stages      : ${m.failed}
rolled back        : ${m.rolledBack}
retries            : ${m.retryCount}
invalidated        : ${m.invalidated}
human decisions    : ${m.approvalCount} approved, ${m.rejectionCount} rejected
end-to-end latency : ${secs(m.endToEndLatency)}
time in stages     : ${secs(m.totalStageTime)}
waiting on humans  : ${secs(m.approvalWaitTime)}
mean recovery time : ${m.meanTimeToRecovery == null ? 'n/a (nothing failed then recovered)' : secs(m.meanTimeToRecovery)}`) + `</pre>`;
}

$('start').onclick = async () => {
  const requirement = $('requirement').value.trim();
  if (!requirement) return;
  $('start').disabled = true;
  try {
    const res = await json('/api/runs', post({ requirement }));
    selected = res.runId;
    $('requirement').value = '';
    tab = 'stages';
    refresh();
  } finally {
    $('start').disabled = false;
  }
};

loadEnvironment();
loadRuns();
setInterval(() => { if (!selected) loadRuns(); }, 5000);
</script>
</body>
</html>
